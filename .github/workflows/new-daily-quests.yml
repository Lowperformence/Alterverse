name: Daily quests and graphics regression
on:
  pull_request:
    paths:
      - 'Assets/Alterverse/Scripts/Profile/DailyQuestProgress.cs'
      - 'Assets/Alterverse/Scripts/Multiplayer/CoopMatchResultSync.cs'
      - 'Assets/Alterverse/Scripts/Content/PlayerChallengeContent.cs'
      - 'Tools/Shop/RewardedAdsRegression/**'
      - 'Assets/Alterverse/Scripts/Performance/MobilePerformanceProfile.cs'
      - 'Tools/Graphics/AutoProfileRegression/**'
      - '.github/workflows/new-daily-quests.yml'
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python Tools/Shop/RewardedAdsRegression/run.py --dotnet-root "$DOTNET_ROOT"
      - run: python Tools/Multiplayer/HotZoneResultRegression/run.py --dotnet-root "$DOTNET_ROOT"
      - run: python Tools/Graphics/AutoProfileRegression/run.py --dotnet-root "$DOTNET_ROOT"
