name: Hero concept source inventory
on:
  push:
    branches: ['art/hero-parts-redesign-20261011']
    paths: ['Tools/HeroConcepts/inspect_roster.py', '.github/workflows/hero-concepts-inspection.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libsm6
          python -m pip install bpy==4.5.14 numpy pillow
      - run: python Tools/HeroConcepts/inspect_roster.py
      - uses: actions/upload-artifact@v4
        with:
          name: hero-concept-source-inventory
          path: |
            ArtSource/Heroes/Concepts/input-contracts.json
            ArtSource/Heroes/Concepts/Licenses
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ArtSource/Heroes/Concepts/input-contracts.json ArtSource/Heroes/Concepts/Licenses
          if ! git diff --cached --quiet; then
            git commit -m 'Record existing hero contracts and retrieve vendor anatomy notices'
            git push origin HEAD:'${{ github.ref_name }}'
          fi
