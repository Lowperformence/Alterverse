name: Arena visual source regression
on:
  pull_request:
    paths:
      - 'Assets/Alterverse/Scripts/Visuals/**'
      - 'Assets/Alterverse/Scripts/Performance/MobilePerformanceProfile.cs'
      - 'Assets/Alterverse/Scripts/Combat/CentralHealingPickup.cs'
      - 'Tools/Maps/Regression/check_*.py'
      - '.github/workflows/arena-visual-regression.yml'
  push:
    paths:
      - 'Assets/Alterverse/Scripts/Visuals/**'
      - 'Assets/Alterverse/Scripts/Performance/MobilePerformanceProfile.cs'
      - 'Assets/Alterverse/Scripts/Combat/CentralHealingPickup.cs'
      - 'Tools/Maps/Regression/check_*.py'
      - '.github/workflows/arena-visual-regression.yml'
jobs:
  source-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /Assets/Alterverse/Scripts/Combat/CentralHealingPickup.cs
            /Assets/Alterverse/Scripts/Performance/MobilePerformanceProfile.cs
            /Assets/Alterverse/Scripts/Visuals/*.cs
            /Tools/Maps/Regression/check_*.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install tree-sitter==0.25.2 tree-sitter-c-sharp==0.23.1
      - run: python Tools/Maps/Regression/check_visual_syntax.py
      - run: python Tools/Maps/Regression/check_crater_index.py
