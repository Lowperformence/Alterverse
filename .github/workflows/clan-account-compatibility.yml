name: Clan account compatibility
on:
  pull_request:
    paths:
      - 'Server/commerce/**'
      - 'Tools/ClanRestore/**'
      - 'Assets/Alterverse/Resources/Commerce/ShardCatalog.json'
      - 'Assets/Alterverse/Resources/Social/SafeIdentityCatalog.json'
      - '.github/workflows/clan-account-compatibility.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone-node-clans:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r Server/commerce/requirements.txt
      - name: Existing source data and shared clan/chat protocol
        run: |
          python Tools/ClanRestore/generate_standalone_data.py --check
          PYTHONPATH=Server/commerce python -m unittest discover -s Tools/ClanRestore -p 'test_standalone.py' -q
      - name: Original account functions and encrypted report delivery
        run: |
          node Tools/ClanRestore/test_standalone_integrity.mjs
          node Tools/ClanRestore/test_standalone_smtp.mjs
      - name: Produce the single-file Node account server
        run: |
          node Server/commerce/node/attach-standalone-clans.mjs Tools/ClanRestore/fixtures/node-2026-10-22.2-cloud-export.js "$RUNNER_TEMP/index.js"
          node --check "$RUNNER_TEMP/index.js"
      - name: Actual Functions Framework and unchanged package manifest
        run: |
          mkdir -p "$RUNNER_TEMP/clan-standalone-runtime"
          cp "$RUNNER_TEMP/index.js" "$RUNNER_TEMP/clan-standalone-runtime/index.js"
          cp Tools/ClanRestore/fixtures/package.json "$RUNNER_TEMP/clan-standalone-runtime/package.json"
          npm --prefix "$RUNNER_TEMP/clan-standalone-runtime" install --omit=dev --ignore-scripts --no-audit --no-fund
          python Tools/ClanRestore/test_standalone_startup.py "$RUNNER_TEMP/clan-standalone-runtime"
