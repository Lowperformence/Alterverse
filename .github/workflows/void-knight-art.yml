name: Void Knight model regression
on:
  pull_request:
    paths: ['ArtSource/Heroes/VoidKnight/**', 'Assets/Alterverse/Resources/AuthoredHeroes/VoidKnight*', 'Assets/Alterverse/Resources/AuthoredHeroes/VoidKnightTextures/**', 'Assets/Alterverse/Editor/AuthoredHeroImporter.cs', 'Tools/Combat/VoidKnightRegression/**', 'Assets/Alterverse/Editor/VoidKnight*.cs', '.github/workflows/void-knight-art.yml']
  push:
    branches: ['dev/vertical-slice']
    paths: ['ArtSource/Heroes/VoidKnight/**', 'Assets/Alterverse/Resources/AuthoredHeroes/VoidKnight*', 'Assets/Alterverse/Resources/AuthoredHeroes/VoidKnightTextures/**', 'Assets/Alterverse/Editor/AuthoredHeroImporter.cs', 'Tools/Combat/VoidKnightRegression/**', 'Assets/Alterverse/Editor/VoidKnight*.cs', '.github/workflows/void-knight-art.yml']
jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Blender
        run: |
          curl --fail --silent --show-error --location https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz --output /tmp/blender.tar.xz
          echo '8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09  /tmp/blender.tar.xz' | sha256sum --check
          tar --extract --file /tmp/blender.tar.xz --directory /tmp
      - name: Check native source rig, contacts and visible eyes
        run: /tmp/blender-5.0.1-linux-x64/blender --background --threads 2 --python-exit-code 1 --python ArtSource/Heroes/VoidKnight/validate_refinement.py
      - name: Reimport runtime FBX
        run: /tmp/blender-5.0.1-linux-x64/blender --background --threads 2 --python-exit-code 1 --python ArtSource/Heroes/VoidKnight/validate_fbx.py
      - name: Open individual armor modules
        run: /tmp/blender-5.0.1-linux-x64/blender --background --threads 2 --python-exit-code 1 --python ArtSource/Heroes/VoidKnight/validate_modules.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check combat, shop price and release lock
        run: python3 Tools/Combat/VoidKnightRegression/run.py --dotnet-root "$DOTNET_ROOT"

