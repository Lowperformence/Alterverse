name: Build Void Knight violet armor
on:
  pull_request:
    paths:
      - 'ArtSource/Heroes/VoidKnight/build_violet_armor.py'
      - 'ArtSource/Heroes/VoidKnight/validate_violet_armor.py'
      - '.github/workflows/void-knight-violet-build.yml'
permissions:
  contents: write
concurrency:
  group: void-violet-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Skip completed generated revision
        id: gate
        run: |
          if [ "$(git log -1 --format=%s)" = 'Build Void Knight violet armor assets' ]; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install pinned Blender
        if: steps.gate.outputs.build == 'true'
        run: |
          curl --fail --silent --show-error --location https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz --output /tmp/blender.tar.xz
          echo '8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09  /tmp/blender.tar.xz' | sha256sum --check
          tar --extract --file /tmp/blender.tar.xz --directory /tmp
      - name: Model, validate, export and render
        if: steps.gate.outputs.build == 'true'
        run: |
          set -euo pipefail
          blender=/tmp/blender-5.0.1-linux-x64/blender
          source=ArtSource/Heroes/VoidKnight
          for script in build_violet_armor.py validate_violet_armor.py export_void_knight.py validate_fbx.py export_modules.py validate_modules.py validate_refinement.py render_reference.py render_violet_details.py; do
            "$blender" --background --threads 2 --python-exit-code 1 --python "$source/$script"
          done
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.build == 'true'
        with:
          name: void-knight-violet-armor
          path: |
            ArtSource/Heroes/VoidKnight/VoidKnight.blend
            ArtSource/Heroes/VoidKnight/VoidKnight-model-preview.png
            ArtSource/Heroes/VoidKnight/Construction/
            ArtSource/Heroes/VoidKnight/Modules/
            ArtSource/Heroes/VoidKnight/Validation/
            ArtSource/Heroes/VoidKnight/fbx-validation.json
            Assets/Alterverse/Resources/AuthoredHeroes/VoidKnight.fbx
      - name: Commit verified assets to the same feature branch
        if: steps.gate.outputs.build == 'true'
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual=$(git ls-remote origin "refs/heads/$HEAD_BRANCH" | cut -f1)
          test "$actual" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ArtSource/Heroes/VoidKnight/VoidKnight.blend ArtSource/Heroes/VoidKnight/Modules ArtSource/Heroes/VoidKnight/Construction ArtSource/Heroes/VoidKnight/Validation ArtSource/Heroes/VoidKnight/VoidKnight-model-preview.png ArtSource/Heroes/VoidKnight/fbx-validation.json Assets/Alterverse/Resources/AuthoredHeroes/VoidKnight.fbx
          git commit -m 'Build Void Knight violet armor assets'
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
