name: Battle supply and bounty regression
on:
  pull_request:
    paths:
      - 'Assets/Alterverse/Scripts/Combat/BattleItemRuntime.cs'
      - 'Assets/Alterverse/Scripts/UI/CombatFeedbackHUD.cs'
      - 'Assets/Alterverse/Resources/Localization/InterfaceLanguages.json'
      - 'Tools/Combat/BattleSupplyRegression/**'
      - 'Tools/Combat/BountyRegression/**'
      - 'Tools/UI/LanguageBannerRegression/**'
      - '.github/workflows/battle-supply-bounty.yml'
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python Tools/Combat/BattleSupplyRegression/run.py --dotnet-root "$DOTNET_ROOT"
      - run: python Tools/Combat/BountyRegression/run.py --dotnet-root "$DOTNET_ROOT"
      - run: python Tools/UI/LanguageBannerRegression/run.py --dotnet-root "$DOTNET_ROOT"
      - run: python Tools/Combat/KillstreakRegression/run.py --dotnet-root "$DOTNET_ROOT"
