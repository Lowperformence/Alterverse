name: Planet weather regression
on:
  push:
    paths:
      - 'Assets/Alterverse/Scripts/Visuals/PlanetWeatherRuntime.cs'
      - 'Assets/Alterverse/Scripts/Visuals/WindVfxRuntime.cs'
      - 'Assets/Alterverse/Scripts/Visuals/PlanetWindCatalog.cs'
      - 'Assets/Alterverse/Resources/PlanetWindCatalog.asset'
      - 'Assets/Vefects/Wind VFX URP/VFX/Particles/**'
      - 'Assets/Alterverse/Scripts/Match/ArenaVariantRuntime.cs'
      - 'Assets/Resources/DF_PlanetWeather.shader'
      - 'Tools/Weather/**'
      - '.github/workflows/planet-weather-regression.yml'
  pull_request:
    paths:
      - 'Assets/Alterverse/Scripts/Visuals/PlanetWeatherRuntime.cs'
      - 'Assets/Alterverse/Scripts/Visuals/WindVfxRuntime.cs'
      - 'Assets/Alterverse/Scripts/Visuals/PlanetWindCatalog.cs'
      - 'Assets/Alterverse/Resources/PlanetWindCatalog.asset'
      - 'Assets/Vefects/Wind VFX URP/VFX/Particles/**'
      - 'Assets/Alterverse/Scripts/Match/ArenaVariantRuntime.cs'
      - 'Assets/Resources/DF_PlanetWeather.shader'
      - 'Tools/Weather/**'
      - '.github/workflows/planet-weather-regression.yml'
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python Tools/Weather/Regression/run.py --dotnet-root "$DOTNET_ROOT"

      - run: python Tools/Weather/run_wind.py --dotnet-root "$DOTNET_ROOT"
