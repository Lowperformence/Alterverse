name: Killstreak rewards and transport
on:
  pull_request:
    paths:
      - 'Assets/Alterverse/Scripts/Combat/KillstreakRewardState.cs'
      - 'Assets/Alterverse/Scripts/UI/CombatFeedbackHUD.cs'
      - 'Assets/Alterverse/Scripts/Multiplayer/**'
      - 'Tools/Combat/KillstreakRegression/**'
      - '.github/workflows/killstreak-regression.yml'
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Assets/Alterverse/Scripts
            Tools/Combat/KillstreakRegression
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install tree-sitter==0.25.2 tree-sitter-c-sharp==0.23.1
      - run: python Tools/Combat/KillstreakRegression/check_syntax.py
      - run: python Tools/Combat/KillstreakRegression/run.py --dotnet-root "$DOTNET_ROOT"
