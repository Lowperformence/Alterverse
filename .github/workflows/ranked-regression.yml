name: Ranked and account regression
on:
  push:
    branches: ['dev/vertical-slice']
    paths: ['Assets/Alterverse/Scripts/**', 'Assets/Alterverse/Resources/Social/**', 'Server/**', 'Tools/Ranked/**', '.github/workflows/ranked-regression.yml']
  pull_request:
    paths: ['Assets/Alterverse/Scripts/**', 'Assets/Alterverse/Resources/Social/**', 'Server/**', 'Tools/Ranked/**', '.github/workflows/ranked-regression.yml']
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r Server/commerce/requirements.txt
      - run: python -m unittest discover -s Server/commerce -q
      - run: python -m unittest discover -s Tools/Ranked -p 'test_*.py' -q
      - run: python Tools/Ranked/Regression/run.py --dotnet-root "$DOTNET_ROOT"

