name: Nine hero concept models
on:
  push:
    branches: ['art/hero-parts-redesign-20261011']
    paths: ['Tools/HeroConcepts/build_models.py', '.github/workflows/hero-concept-authoring.yml']
permissions:
  contents: write
concurrency:
  group: hero-concept-models-${{ github.ref }}
  cancel-in-progress: true
jobs:
  author:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Blender LTS authoring runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libsm6
          python -m pip install bpy==4.5.14 numpy pillow
      - name: Build nine models, render front and back, validate FBX rigs
        env:
          OMP_NUM_THREADS: '2'
        run: python Tools/HeroConcepts/build_models.py
      - name: Retain actual model renders and validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nine-hero-model-review
          path: |
            ArtSource/Heroes/ConceptModels/*.png
            ArtSource/Heroes/ConceptModels/validation-report.json
          if-no-files-found: ignore
      - name: Commit validated assets on the authorized art branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/Alterverse/Resources/CyberRanger/Model.bytes Assets/Alterverse/Resources/UmbralMage/Model.bytes Assets/Alterverse/Resources/CyberShark/Model.bytes Assets/Alterverse/Resources/SiegeTank/Model.bytes Assets/Alterverse/Resources/ChronoTraveler/Model.bytes Assets/Alterverse/Resources/AuthoredHeroes/Veyr.fbx Assets/Alterverse/Resources/AuthoredHeroes/Mira.fbx Assets/Alterverse/Resources/AuthoredHeroes/Rook.fbx Assets/Alterverse/Resources/AuthoredHeroes/Timmy.fbx Assets/Alterverse/Resources/HeroConcepts Assets/Alterverse/Resources/HeroConcepts.meta ArtSource/Heroes/Veyr.blend ArtSource/Heroes/Mira.blend ArtSource/Heroes/Rook.blend ArtSource/Heroes/AndromedaTimmy/AndromedaTimmy.blend ArtSource/Heroes/ConceptModels ArtSource/Heroes/Concepts/Provenance Docs/HeroProvenanceStatus.md
          if ! git diff --cached --quiet; then
            git commit -m 'Build and validate all nine concept hero models with editable sources'
            git fetch origin '${{ github.ref_name }}'
            git rebase 'origin/${{ github.ref_name }}'
            git push origin HEAD:'${{ github.ref_name }}'
          fi
